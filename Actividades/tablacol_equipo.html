<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Emilio Fraide, Citlali Chavez, Axel Montes, Sofia Bonilla, Jorge Trejo">
    <meta name="description" content="Pagina que muestra en una tabla los colores favoritos de los integrantes del equipo 2">
    <title>Tabla de colores</title>
    <link rel="stylesheet" href="Color_equipo_fav.css">
</head>
<body>
    <a href="#Titulo">
        <h2 class="note"> Práctica 2: Introducción a <br>CSS</h2>
    </a>
    <table class="table">
        <caption> Nuestros colores favoritos </caption>
        <thead>
            <tr>
                <th scope="col">Integrante</th>
                <th scope="col">Color</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="nombre">Citlali</td>
                <td id="citlali" class="color-favorito">rosa</td>
            </tr>
            <tr>
                <td class="nombre">Axel</td>
                <td id="axel" class="color-favorito">azul</td>
            </tr>
            <tr>
                <td class="nombre">Sofia</td>
                <td id="sofia" class="color-favorito">negro</td>
            </tr>
            <tr>
                <td class="nombre">Jorge</td>
                <td id="jorge" class="color-favorito">rojo</td>
            </tr>
            <tr>
                <td class="nombre">Emilio</td>
                <td id="emilio" class="color-favorito">verde</td>
            </tr>
        </tbody>
    </table>
    <p>Este es mi primer <br>sitio con CSS!</p>
</body>
</html>
